  - id: bore_1_dry_or_faulty
    type: sensor_pair
    description: "bore drawing current (inferred running, no dedicated status sensor exists) but no flow -- possibly dry or faulty"
    condition_sensor: bore_1_current
    condition_op: gt
    condition_value: 0.5   # some current draw = motor running -- same threshold bore_1_power_draw_failed below uses for the same inference
    expect_sensor: bore_1_flow
    expect_op: gt
    expect_value: 0.1
    sustained_seconds: 300
    event_type: BORE_NO_FLOW
    severity: 1

  - id: bore_1_power_draw_failed
    type: commanded_vs_sensor
    description: >-
      bore_1 commanded on but power draw sensor shows ~nothing --
      MCU/wiring/pump failure. CAVEAT still applies until the real ack
      interface exists (see memo_ingestion_ack_interface.md): a
      legitimate MCU-reported dry-well refusal will ALSO show ~zero
      draw, and this rule can't yet tell "dead" apart from "correctly
      refused" -- once action_confirmation.py's ACTUATOR_COMMAND_REFUSED
      is real (not just guessed), this should be gated to skip firing
      when that already explains the zero draw, rather than both firing
      independently for the same underlying event.
    commanded_target: bore_1
    commanded_action_type: START_PUMP
    expect_sensor: bore_1_current   # CONFIRMED against water.yaml (was guessed as bore_1_power_draw)
    expect_op: gt
    expect_value: 0.5
    sustained_seconds: 30
    event_type: BORE_NO_POWER_DRAW
    severity: 1

  # --- Dry-well detection: owned by the bore's own MCU, not core ---
  # The MCU is what actually needs to protect the pump, and it needs to
  # cut power within seconds of detecting a dry well -- core's cycle
  # (10-60s) is too slow to be the thing making that call safely.
  #
  # RESOLVED as a separate field, per your call: the bore's MCU reports
  # this through the SAME ack channel every other actuator already uses
  # (action_confirmation.py) -- it acks the START_PUMP command with
  # ack_status: "dry" instead of "ok", rather than a dedicated cutoff
  # sensor. Surfaces as ACTUATOR_COMMAND_REFUSED, already watched by
  # fill_tank_1_from_bore's fault_event list in rules.yaml. See
  # memo_ingestion_ack_interface.md for the exact interface ask -- one
  # mechanism now covers both "did the command land" and "why was it
  # refused" for every actuator, not just this one.

  - id: bore_1_running_no_flow
    type: commanded_vs_sensor
    description: "core commanded bore_1 on, but its flow sensor shows nothing -- independent of bore_1_dry_or_faulty above, which trusts the bore's own status sensor instead of core's command record"
    commanded_target: bore_1
    commanded_action_type: START_PUMP
    expect_sensor: bore_1_flow
    expect_op: gt
    expect_value: 0.1
    sustained_seconds: 300
    event_type: BORE_COMMANDED_NO_FLOW
    severity: 1

  - id: dads_ute_geofence
    type: geofence
    description: "Dad's Ute (ute_1) more than 250m from the farm's reference point"
    asset: ute_1
    # CONFIRMED (ingestion, 12/7/2026): separate latitude/longitude
    # metrics, decimal degrees, 6dp -- not a tuple. Was a guess before.
    lat_sensor: ute_1_latitude
    lon_sensor: ute_1_longitude
    # Hardwired, shared across all vehicles -- edit directly here.
    # This is the centroid of the tank/bore/zone cluster already in the
    # registry (not the true property centroid -- the farm's a ~500x500x700m
    # triangle and these assets are all clustered in one corner of it).
    # Replace with whatever reference point actually makes sense to you.
    center: [-31.950457, 115.860276]
    radius_meters: 250
    # NOTE: from any single center, the far corners of a 500x500x700m
    # right triangle are 350m+. 250m WILL false-positive at the far end
    # of the property -- fine for initial IRL testing per your call,
    # widen once you've seen it in practice.
    sustained_seconds: 0
    event_type: VEHICLE_OUTSIDE_GEOFENCE
    severity: 1   # CRITICAL
    # Evidence trail -- survives independently of ingestion's 90-day
    # purge (core/incident_recorder.py, writes to config/incident_log.json,
    # never auto-deleted). CORRECTED against real vehicles.yaml -- asset
    # id was never actually "dads_ute" (that was a placeholder guess
    # predating real registry data), real id is ute_1, sensors properly
    # prefixed ute_1_* with no mismatch. There's also no "status" sensor
    # at all -- real ute_1 sensors are temperature/battery_voltage/
    # latitude/longitude/fuel/hours.
    record_sensors:
      - ute_1_latitude
      - ute_1_longitude
      - ute_1_temperature
      - ute_1_fuel
      - ute_1_battery_voltage
      - ute_1_hours

  - id: load_shed_ineffective
    type: action_effect_check
    description: "LOAD_SHEDDING ran but battery current draw didn't actually drop"
    trigger_action_type: LOAD_SHEDDING
    check_sensor: battery_1_current
    check_after_seconds: 120
    # battery_1_current is NEGATIVE while discharging (confirmed in real
    # data, e.g. -2.959) -- successful load-shedding moves it TOWARD
    # zero, which is numerically an INCREASE, not a decrease. Easy to
    # get backwards -- if a future check_sensor uses the opposite sign
    # convention (positive = draw), this needs flipping to decreases_by.
    expect_change_op: increases_by   # increases_by | decreases_by | changes_by
    expect_change_value: 1.0
    event_type: LOAD_SHED_INEFFECTIVE
    severity: 1
