# anomaly_rules.yaml
# Cross-sensor / commanded-vs-actual expectation checks. New instances
# of the 3 types below are pure YAML -- see anomaly_engine.py for what
# each type means and what a genuinely new type would need.

rules:

  - id: tank_1_fault_check
    type: actuator_fault_matrix
    description: "tank_1 valve fault diagnosis -- commanded state read from supply_engine (its own tank valve command record), not inferred. bore_1 is permanently plumbed to tank_1, but this check no longer needs that -- commanded state now comes directly from supply_engine's own valve command record, real not inferred."
    asset: tank_1
    commanded_target: tank_1
    commanded_action_type: OPEN_VALVE
    level_sensor: tank_1_level
    flow_sensor: tank_1_flow_out
    flow_deadband: 0.5
    level_slope_deadband: 0.001
    sustained_seconds: 300

  - id: tank_2_fault_check
    type: actuator_fault_matrix
    description: "tank_2 valve fault diagnosis -- commanded state read from supply_engine (its own tank valve command record), not inferred."
