# Crop Profile: Tomato
# Validated for: Gingin, WA
# Last reviewed: 2026

crop: Tomato
family: Solanaceae
gingin_suitability: high

cultivars:
  - name: Grosse Lisse
    notes: Standard round slicing tomato. Consistent wholesale demand.
  - name: Roma
    notes: Paste/processing type. Slightly more heat tolerant. Concentrated harvest window useful for planning.
  - name: Tommy Toe
    notes: Cherry type. Higher price per kg but more labour at harvest.

climate:
  temp_min_c: 15
  temp_max_c: 38          # fruit cracking and catface above 35 sustained
  frost_tolerance: none
  optimal_temp_c: [20, 28]
  rainfall_dependency: low
  humidity_preference: low   # high humidity = fungal risk, Gingin is ideal
  frost_risk_months: [6, 7, 8]

planting_windows:
  - label: Spring
    start_month: 9
    end_month: 10
    harvest_offset_weeks: 14
    notes: Primary window. Harvest Dec–Feb. Watch for extreme heat at fruit set.

  - label: Autumn
    start_month: 2
    end_month: 3
    harvest_offset_weeks: 16
    notes: Mild harvest window. Lower price due to market glut in autumn.

water:
  daily_litres_per_sqm: 5.0
  season_mm_equivalent: 650
  irrigation_method_preference: drip
  critical_stages:
    - stage: Fruit Set
      notes: Blossom end rot risk if water uneven. Maintain consistent moisture.
    - stage: Fruit Sizing
      notes: Peak demand. Do not deficit.

soil:
  ph_min: 6.0
  ph_max: 6.8
  drainage: well_drained
  compaction_tolerance: low
  salinity_tolerance_ec_ds_m: 2.5

yield:
  expected_kg_per_sqm_p50: 8.0
  expected_kg_per_sqm_p10: 4.5
  expected_kg_per_sqm_p90: 12.0
  premium_grade_pct_p50: 60
  second_grade_pct_p50: 28
  reject_pct_p50: 12

market:
  wholesale_price_per_kg_indicative: 2.80
  price_seasonality_peak_months: [6, 7, 8, 9]
  price_seasonality_low_months: [12, 1, 2]
  quality_premium_multiplier: 1.30

rotation:
  min_years_between_plantings: 3
  do_not_follow:
    - Capsicum
    - Eggplant
    - Potato
    - Chilli
  notes: Solanaceae rotation rules apply. Follow with a legume or brassica.
