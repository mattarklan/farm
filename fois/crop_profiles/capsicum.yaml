# Crop Profile: Capsicum (Sweet Pepper)
# Validated for: Gingin, WA (Mediterranean climate, hot dry summers, mild winters)
# Last reviewed: 2026

crop: Capsicum
family: Solanaceae
gingin_suitability: high

cultivars:
  - name: Californian Wonder
    notes: Classic blocky red/green. Reliable in WA summers. Good market demand.
  - name: Yolo Wonder
    notes: Slightly more heat tolerant than Californian Wonder.
  - name: Marconi
    notes: Long sweet pepper. Good wholesale price premium.

# ---------------------------------------------------------------------------
# Climate requirements
# If farm weather history falls outside these bands the crop is filtered out.
# ---------------------------------------------------------------------------
climate:
  temp_min_c: 16          # will not set fruit below this
  temp_max_c: 38          # heat stress above this, fruit damage above 40
  frost_tolerance: none   # any frost event = crop failure
  optimal_temp_c: [21, 29]

  # Gingin average annual rainfall ~450mm — capsicums are fine with irrigation
  rainfall_dependency: low   # managed under irrigation, rain is a bonus

  # Gingin humidity is generally low — good for capsicums, reduces fungal risk
  humidity_preference: low_to_moderate

  # Months unsuitable due to frost risk in Gingin (light frosts possible Jun–Aug)
  frost_risk_months: [6, 7, 8]

# ---------------------------------------------------------------------------
# Planting windows (Gingin-specific)
# ---------------------------------------------------------------------------
planting_windows:
  - label: Spring
    start_month: 9    # September
    end_month: 10     # October
    harvest_offset_weeks: 16
    notes: Best window. Harvest Feb–Apr before peak summer heat.

  - label: Late Summer
    start_month: 1    # January
    end_month: 2      # February
    harvest_offset_weeks: 18
    notes: Riskier. High heat during establishment. Requires shade cloth consideration.

# ---------------------------------------------------------------------------
# Water requirements
# ---------------------------------------------------------------------------
water:
  daily_litres_per_sqm: 4.5      # peak summer demand
  season_mm_equivalent: 600
  irrigation_method_preference: drip
  critical_stages:
    - stage: Flowering
      notes: Water stress at flowering causes flower drop. Do not deficit irrigate.
    - stage: Fruit Set
      notes: Consistent moisture critical for even fruit sizing.

# ---------------------------------------------------------------------------
# Soil preferences
# ---------------------------------------------------------------------------
soil:
  ph_min: 6.0
  ph_max: 7.0
  drainage: well_drained
  compaction_tolerance: low
  salinity_tolerance_ec_ds_m: 1.5   # sensitive to salt

# ---------------------------------------------------------------------------
# Yield model (empirical starting point — will be replaced by farm history)
# ---------------------------------------------------------------------------
yield:
  expected_kg_per_sqm_p50: 6.5
  expected_kg_per_sqm_p10: 3.8
  expected_kg_per_sqm_p90: 9.2
  premium_grade_pct_p50: 65
  second_grade_pct_p50: 25
  reject_pct_p50: 10

# ---------------------------------------------------------------------------
# Market indicators (rough starting point — market.py refines these)
# ---------------------------------------------------------------------------
market:
  wholesale_price_per_kg_indicative: 3.20
  price_seasonality_peak_months: [5, 6, 7, 8]   # winter demand peak
  price_seasonality_low_months: [12, 1, 2]        # glut in summer
  quality_premium_multiplier: 1.35   # premium grade vs standard

# ---------------------------------------------------------------------------
# Rotation
# ---------------------------------------------------------------------------
rotation:
  min_years_between_plantings: 3
  do_not_follow:
    - Tomato
    - Eggplant
    - Potato
    - Chilli
  notes: All Solanaceae share diseases. Rotate with Brassicas or legumes.
