# Crop Profile: Zucchini (Courgette)
# Validated for: Gingin, WA
# Last reviewed: 2026

crop: Zucchini
family: Cucurbitaceae
gingin_suitability: high

cultivars:
  - name: Black Jack
    notes: Dark green. Standard market variety. Fast to first harvest.
  - name: Golden
    notes: Yellow skin. Niche premium price. Lower total yield.

climate:
  temp_min_c: 18
  temp_max_c: 40          # more heat tolerant than Solanaceae
  frost_tolerance: none
  optimal_temp_c: [22, 32]
  rainfall_dependency: low
  humidity_preference: low_to_moderate
  frost_risk_months: [6, 7, 8]

planting_windows:
  - label: Spring
    start_month: 9
    end_month: 11
    harvest_offset_weeks: 8    # fast crop — 8 weeks to first harvest
    notes: Short season. Can get 2 crops in a good year. Good gap filler.

  - label: Summer
    start_month: 12
    end_month: 1
    harvest_offset_weeks: 7
    notes: Very fast in heat. Monitor for powdery mildew.

water:
  daily_litres_per_sqm: 3.5
  season_mm_equivalent: 300    # short season, lower total
  irrigation_method_preference: drip
  critical_stages:
    - stage: Flowering
      notes: Needs pollinators or hand pollination under covers.

soil:
  ph_min: 6.0
  ph_max: 7.5
  drainage: well_drained
  compaction_tolerance: moderate
  salinity_tolerance_ec_ds_m: 3.2

yield:
  expected_kg_per_sqm_p50: 5.0
  expected_kg_per_sqm_p10: 2.8
  expected_kg_per_sqm_p90: 7.5
  premium_grade_pct_p50: 70
  second_grade_pct_p50: 22
  reject_pct_p50: 8

market:
  wholesale_price_per_kg_indicative: 2.20
  price_seasonality_peak_months: [5, 6, 7]
  price_seasonality_low_months: [11, 12, 1]
  quality_premium_multiplier: 1.20

rotation:
  min_years_between_plantings: 2
  do_not_follow:
    - Cucumber
    - Pumpkin
    - Melon
  notes: Cucurbit rotation. Good follow crop after Solanaceae.
