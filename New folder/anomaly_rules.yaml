  - id: header_tank_1_fault_check
    type: actuator_fault_matrix
    description: "header_tank_1 valve fault diagnosis -- commanded state read from supply_engine (its own tank valve command record), not inferred."
    asset: header_tank_1
    commanded_target: header_tank_1
    commanded_action_type: OPEN_VALVE
    level_sensor: header_tank_1_level
    flow_sensor: header_tank_1_flow_out
    flow_deadband: 0.5
    level_slope_deadband: 0.001
    sustained_seconds: 300

  - id: bore_1_dry_or_faulty
    type: sensor_pair
    description: "bore drawing current (inferred running, no dedicated status sensor exists) but no flow -- possibly dry or faulty"
    condition_sensor: bore_1_current
    condition_op: gt
    condition_value: 0.5   # some current draw = motor running -- same threshold bore_1_power_draw_failed below uses for the same inference
    expect_sensor: bore_1_flow
    expect_op: gt
    expect_value: 0.1
    sustained_seconds: 300
    event_type: BORE_NO_FLOW
    severity: 1

  - id: bore_1_power_draw_failed
    type: commanded_vs_sensor
    description: >-
      bore_1 commanded on but power draw sensor shows ~nothing --
      MCU/wiring/pump failure. CAVEAT: a legitimate MCU-initiated
      dry-well cutoff (see note below) will ALSO show ~zero draw once
      it's cut the pump -- this rule can't yet tell "dead" apart from
      "correctly protected itself" and will misfire as a false
      MCU/wiring alarm on a clean cutoff until it can. Once the MCU's
      dry-cutoff-report sensor exists, gate this check on it (skip
      firing when that flag is set) rather than leaving both to fire
      independently.
    commanded_target: bore_1
    commanded_action_type: START_PUMP
    expect_sensor: bore_1_current   # CONFIRMED against water.yaml (was guessed as bore_1_power_draw)
    expect_op: gt
    expect_value: 0.5
    sustained_seconds: 30
    event_type: BORE_NO_POWER_DRAW
    severity: 1

  # --- Dry-well detection: owned by the bore's own MCU, not core ---
  # The MCU is what actually needs to protect the pump, and it needs to
  # cut power within seconds of detecting a dry well -- core's cycle
  # (10-60s) is too slow to be the thing making that call safely. Core's
  # job is narrower: notice the MCU's own report, on whichever cycle
  # comes after the MCU made its call, and decide whether to retry
  # later or leave it alone (fill_tank_1_from_bore's fallback in
  # rules.yaml already covers "retry later" via its fault_event list --
  # add the real event_type below to that list once it exists).
  #
  # NEEDS FROM INGESTION: a sensor/flag reporting the MCU's own
  # dry-cutoff decision (e.g. bore_1_dry_cutoff_flag, boolean or a
  # timestamp of last cutoff) -- this is a single-sensor threshold
  # check, so it belongs in event_rules.yaml as an ordinary rule once
  # that field exists, not here (anomaly_engine is for cross-sensor/
  # commanded-vs-actual comparisons, this isn't one). The previous
  # version of this file guessed at inferring dry-run from a raw
  # current-draw band instead (no MCU report needed) -- removed, since
  # it's both slower than the MCU's own fast cutoff and duplicative of
  # it once the real flag exists.

  - id: bore_1_running_no_flow
    type: commanded_vs_sensor
    description: "core commanded bore_1 on, but its flow sensor shows nothing -- independent of bore_1_dry_or_faulty above, which trusts the bore's own status sensor instead of core's command record"
    commanded_target: bore_1
    commanded_action_type: START_PUMP
    expect_sensor: bore_1_flow
    expect_op: gt
    expect_value: 0.1
    sustained_seconds: 300
    event_type: BORE_COMMANDED_NO_FLOW
    severity: 1

  - id: dads_ute_geofence
    type: geofence
    description: "dads_ute more than 250m from the farm's reference point"
    asset: dads_ute
    # GUESSED field name -- no vehicle has sent a live GPS reading yet.
    lat_sensor: dads_ute_gps_lat
    lon_sensor: dads_ute_gps_lon
    # Hardwired, shared across all vehicles -- edit directly here.
    # This is the centroid of the tank/bore/zone cluster already in the
    # registry (not the true property centroid -- the farm's a ~500x500x700m
    # triangle and these assets are all clustered in one corner of it).
    # Replace with whatever reference point actually makes sense to you.
    center: [-31.950457, 115.860276]
    radius_meters: 250
    # NOTE: from any single center, the far corners of a 500x500x700m
    # right triangle are 350m+. 250m WILL false-positive at the far end
    # of the property -- fine for initial IRL testing per your call,
    # widen once you've seen it in practice.
    sustained_seconds: 0
    event_type: VEHICLE_OUTSIDE_GEOFENCE
    severity: 1   # CRITICAL
    # Evidence trail -- survives independently of ingestion's 90-day
    # purge (core/incident_recorder.py, writes to config/incident_log.json,
    # never auto-deleted). Real confirmed sensor names for dads_ute --
    # note the ute_1_ prefix mismatch (asset_id is "dads_ute" but its
    # sensors are prefixed "ute_1_", same bug as header_tank_1).
    record_sensors:
      - dads_ute_gps_lat
      - dads_ute_gps_lon
      - dads_ute_ute_1_engine_temperature
      - dads_ute_ute_1_fuel
      - dads_ute_ute_1_battery_voltage
      - dads_ute_ute_1_status

  - id: load_shed_ineffective
    type: action_effect_check
    description: "LOAD_SHEDDING ran but battery current draw didn't actually drop"
    trigger_action_type: LOAD_SHEDDING
    check_sensor: battery_1_current
    check_after_seconds: 120
    # battery_1_current is NEGATIVE while discharging (confirmed in real
    # data, e.g. -2.959) -- successful load-shedding moves it TOWARD
    # zero, which is numerically an INCREASE, not a decrease. Easy to
    # get backwards -- if a future check_sensor uses the opposite sign
    # convention (positive = draw), this needs flipping to decreases_by.
    expect_change_op: increases_by   # increases_by | decreases_by | changes_by
    expect_change_value: 1.0
    event_type: LOAD_SHED_INEFFECTIVE
    severity: 1
