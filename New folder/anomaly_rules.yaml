  - id: tank_6_fault_check
    type: actuator_fault_matrix
    description: "tank_6 valve fault diagnosis -- commanded state read from supply_engine (its own tank valve command record), not inferred."
    asset: tank_6
    commanded_target: tank_6
    commanded_action_type: OPEN_VALVE
